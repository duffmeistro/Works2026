.mo-in{position:absolute;inset:0;animation-name:mo-breathe;animation-duration:calc(5s / var(--speed,1));animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-delay:calc(0s - var(--t,0s));animation-play-state:var(--ps,running)}
.mo-orb{position:absolute;inset:0;mix-blend-mode:multiply;animation-name:mo-spin;animation-duration:calc(var(--dur,10s) / var(--speed,1));animation-iteration-count:infinite;animation-timing-function:linear;animation-direction:var(--dir,normal);animation-delay:calc(0s - var(--t,0s));animation-play-state:var(--ps,running)}

.o1{--dur:10s}.o2{--dur:12s;--dir:reverse}.o3{--dur:11s}.o4{--dur:14s;--dir:reverse}.o5{--dur:9s;--dir:reverse}.oh{--dur:16s}.ok1{--dur:13s}.ok2{--dur:17s;--dir:reverse}.ok3{--dur:11s}

<div class="{{themeClass}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--bg-grad); color: var(--fg); font-family: 'Instrument Sans', -apple-system, system-ui, sans-serif; box-sizing: border-box">

        <div class="mo" aria-hidden="true" style="--s: 46px; --speed: 1"><div class="mo-in"><div class="mo-orb o1"><div class="mo-c c1"></div></div><div class="mo-orb o2"><div class="mo-c c2"></div></div><div class="mo-orb o3"><div class="mo-c c3"></div></div><div class="mo-orb o4"><div class="mo-c c4"></div></div><div class="mo-orb o5"><div class="mo-c c5"></div></div><div class="mo-orb oh"><div class="mo-c ch"></div></div><div class="mo-orb ok1"><div class="mo-c k1"></div></div><div class="mo-orb ok2"><div class="mo-c k2"></div></div><div class="mo-orb ok3"><div class="mo-c k3"></div></div></div></div>
      </span>
      <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Fraunces', Georgia, serif; font-variation-settings: 'SOFT' 100, 'WONK' 0; font-size: 22px; line-height: 28px; font-weight: 400; letter-spacing: -0.015em">Gav</span>
        <span style="font-size: 14px; line-height: 20px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Profile, billing and account</span>
      </span>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="flex: none; color: var(--muted2)" aria-hidden="true"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>

    <section style="display: flex; flex-direction: column; gap: 10px; padding-top: 28px">
      <h2 id="appearanceLabel" style="margin: 0 0 0 4px; font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 12px; line-height: 18px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted)">Appearance</h2>

      <h2 style="margin: 0 0 0 4px; font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 12px; line-height: 18px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted)">Sound</h2>

        <button role="switch" aria-checked="{{soundOn}}" onClick="{{toggleSound}}" style="width: 100%; box-sizing: border-box; min-height: 64px; padding: 12px 16px; border: 0; background: transparent; color: var(--fg); display: flex; align-items: center; justify-content: space-between; gap: 16px; text-align: left; cursor: pointer; font: inherit">
          <span style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 16px; line-height: 22px; letter-spacing: -0.005em">Interface sounds</span>
            <span style="font-size: 13px; line-height: 18px; color: var(--muted)">Soft chimes for taps, recording and saving</span>
          </span>

    <sc-for list="{{auroras}}" as="a" hint-placeholder-count="2">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const AURORA = {
  listen: [
    { id: 'blue', name: 'Blue', l: [20, 80, 255], d: [110, 148, 255] },
    { id: 'yellow', name: 'Yellow', l: [255, 206, 0], d: [255, 220, 110] },
    { id: 'sky', name: 'Sky', l: [0, 176, 236], d: [96, 208, 240] },
    { id: 'indigo', name: 'Indigo', l: [70, 100, 255], d: [140, 150, 255] },
    { id: 'lemon', name: 'Lemon', l: [255, 224, 60], d: [255, 232, 150] },
    { id: 'violet', name: 'Violet', l: [140, 90, 255], d: [180, 150, 255] }
  ],
  reply: [
    { id: 'red', name: 'Red', l: [255, 50, 26], d: [250, 130, 110] },
    { id: 'orange', name: 'Orange', l: [255, 130, 10], d: [250, 175, 100] },
    { id: 'amber', name: 'Amber', l: [255, 206, 0], d: [255, 220, 120] },
    { id: 'coral', name: 'Coral', l: [255, 86, 70], d: [245, 120, 130] },
    { id: 'tangerine', name: 'Tangerine', l: [255, 160, 40], d: [250, 190, 120] },
    { id: 'pink', name: 'Pink', l: [255, 79, 163], d: [255, 150, 195] }
  ],
  defaults: { listen: ['blue', 'yellow', 'sky', 'indigo', 'lemon'], reply: ['red', 'orange', 'amber', 'coral', 'tangerine'] }
};

// soft interface sounds, synthesised with the Web Audio API (no audio files)
const SFX = (() => {
  let ctx = null;
  const enabled = () => { try { return window.localStorage.getItem('voiceJournalSound') !== 'off'; } catch (e) { return true; } };
  const audio = () => {
    try {
      if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch (e) { return null; }
  };
  const tone = (c, f, t0, d, o) => {
    o = o || {};
    const t = c.currentTime + t0;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + d);
    const peak = o.g || 0.05;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    osc.connect(g);
    g.connect(c.destination);
    osc.start(t);
    osc.stop(t + d + 0.05);
  };
  const chime = (c, notes, t0, step, d, gain) => notes.forEach((f, i) => {
    tone(c, f, t0 + i * step, d, { type: 'triangle', g: gain });
    tone(c, f * 2, t0 + i * step, d * 0.6, { g: gain * 0.35 });
  });
  const play = (name) => {
    if (!enabled()) return;
    const c = audio();
    if (!c) return;
    switch (name) {
      case 'tap': tone(c, 660, 0, 0.07, { g: 0.035 }); tone(c, 990, 0, 0.05, { g: 0.015 }); break;
      case 'select': tone(c, 740, 0, 0.08, { g: 0.035 }); tone(c, 1110, 0.03, 0.08, { g: 0.015 }); break;
      case 'close': tone(c, 520, 0, 0.1, { to: 380, g: 0.035 }); break;
      case 'open': tone(c, 330, 0, 0.12, { g: 0.035 }); tone(c, 495, 0.05, 0.14, { g: 0.02 }); break;
      case 'on': tone(c, 587, 0, 0.09, { g: 0.04 }); tone(c, 880, 0.06, 0.13, { g: 0.04 }); break;
      case 'off': tone(c, 587, 0, 0.09, { g: 0.035 }); tone(c, 392, 0.06, 0.13, { g: 0.035 }); break;
      case 'start': chime(c, [523, 784], 0, 0.09, 0.32, 0.045); break;
      case 'reflect': tone(c, 440, 0, 0.4, { to: 660, g: 0.045, type: 'triangle' }); tone(c, 880, 0.12, 0.3, { g: 0.015 }); break;
      case 'reply': chime(c, [784, 988], 0, 0.11, 0.4, 0.035); break;
      case 'done': tone(c, 392, 0, 0.26, { type: 'triangle', g: 0.05 }); tone(c, 294, 0.1, 0.36, { type: 'triangle', g: 0.04 }); break;
      case 'save': chime(c, [523, 659, 784, 1047], 0, 0.08, 0.5, 0.04); break;
      case 'saved': chime(c, [659, 784, 988, 1319], 0.85, 0.09, 0.6, 0.04); break;
      case 'discard': tone(c, 330, 0, 0.14, { to: 247, g: 0.04, type: 'triangle' }); tone(c, 247, 0.09, 0.24, { to: 175, g: 0.03, type: 'triangle' }); break;
      default: break;
    }
  };
  return { play, enabled };
})();

class Component extends DCLogic {
  selected(kind) {
    let ids = null;
    try {
      const raw = window.localStorage.getItem('voiceJournalAurora');
      if (raw) ids = (JSON.parse(raw) || {})[kind];
    } catch (e) { ids = null; }
    const valid = AURORA[kind].map((c) => c.id);
    ids = Array.isArray(ids) ? ids.filter((id) => valid.indexOf(id) >= 0) : null;
    return ids && ids.length ? ids : AURORA.defaults[kind].slice();
  }

  toggleColour(kind, id) {
    const cur = this.selected(kind);
    const i = cur.indexOf(id);
    if (i >= 0) {
      if (cur.length === 1) return; // keep at least one colour on
      cur.splice(i, 1);
      
    } else {
      cur.push(id);
      
    }
    let all = {};
    try { all = JSON.parse(window.localStorage.getItem('voiceJournalAurora') || '{}') || {}; } catch (e) { all = {}; }
    all[kind] = cur;
    try { window.localStorage.setItem('voiceJournalAurora', JSON.stringify(all)); } catch (e) { /* storage unavailable */ }
    this.forceUpdate();
  }

  themeName() {
    try { return window.localStorage.getItem('voiceJournalTheme') === 'light' ? 'light' : 'dark'; } catch (e) { return this._theme || 'dark'; }
  }

  setTheme(name) {
    this._theme = name;
    
    try { window.localStorage.setItem('voiceJournalTheme', name); } catch (e) { /* storage unavailable */ }
    this.forceUpdate();
  }

  renderVals() {
    // when storage is blocked, fall back to the choice made on this screen
    let current = this.themeName();
    if (this._theme) current = this._theme;
    const defs = [
      { id: 'dark', label: 'Dark', previewBg: '#1A1916', bar: 'rgba(237,233,223,0.55)', bar2: 'rgba(237,233,223,0.26)' },
      { id: 'light', label: 'Light', previewBg: '#F3F0E8', bar: 'rgba(17,17,17,0.5)', bar2: 'rgba(17,17,17,0.2)' }
    ];
    const options = defs.map((d) => {
      const on = d.id === current;
      return {
        label: d.label,
        on,
        previewBg: d.previewBg,
        theme: d.id === 'light' ? 'theme-light pv-light' : 'theme-dark',
        bar: d.bar,
        bar2: d.bar2,
        ring: on ? 'inset 0 0 0 1.5px var(--cool)' : 'inset 0 0 0 0.5px var(--card-line)',
        dotBg: on ? 'var(--cool)' : 'transparent',
        dotRing: on ? 'none' : 'inset 0 0 0 1px var(--muted2)',
        pick: () => this.setTheme(d.id)
      };
    });
    const isLight = current === 'light';
    const rgb = (c) => 'rgb(' + c.join(',') + ')';
    const auroras = [
      { kind: 'listen', title: 'Your voice aurora', hint: 'Colours that glow while you are speaking' },
      { kind: 'reply', title: "Reverie's voice aurora", hint: 'Colours that glow while Reverie talks back' }
    ].map((g) => {
      const sel = this.selected(g.kind);
      const swatches = AURORA[g.kind].map((c) => {
        const col = isLight ? c.l : c.d;
        const on = sel.indexOf(c.id) >= 0;
        const lum = (0.299 * col[0] + 0.587 * col[1] + 0.114 * col[2]) / 255;
        return {
          label: c.name,
          on,
          bg: rgb(col),
          opacity: on ? '1' : '0.28',
          ring: on ? 'inset 0 0 0 0.5px rgba(0,0,0,0.12)' : 'inset 0 0 0 0.5px var(--card-line)',
          ink: lum > 0.6 ? '#111111' : '#FFFFFF',
          toggle: () => this.toggleColour(g.kind, c.id)
        };
      });
      const cols = AURORA[g.kind].filter((c) => sel.indexOf(c.id) >= 0).map((c) => rgb(isLight ? c.l : c.d));
      const strip = cols.length > 1 ? 'linear-gradient(90deg,' + cols.join(',') + ')' : cols[0];
      return { title: g.title, hint: g.hint, strip, swatches };
    });
    const soundOn = SFX.enabled();
    return {
      themeClass: current === 'light' ? 'theme-light' : 'theme-dark',
      options,
      auroras,
      soundOn,
      soundTrack: soundOn ? 'var(--track-on)' : 'var(--track-off)',
      soundKnob: soundOn ? 'translateX(16px)' : 'translateX(0px)',
      toggleSound: () => {
        const next = !SFX.enabled();
        try { window.localStorage.setItem('voiceJournalSound', next ? 'on' : 'off'); } catch (e) { /* storage unavailable */ }
        this.forceUpdate();
      }
    };
  }
}
</script>
