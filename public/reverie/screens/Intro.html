.theme-dark .c1{opacity:.78}.theme-dark .c2{opacity:.74}.theme-dark .c3{opacity:.8}.theme-dark .c4{opacity:.5}.theme-dark .c5{opacity:.6}
.theme-dark .ch{border-color:#EDE9DF;opacity:.16}
.theme-dark .k1{border-color:#EDE9DF;opacity:.7}.theme-dark .k2{border-color:#E4DECF;opacity:.62}.theme-dark .k3{border-color:#EDE9DF;opacity:.55}

@keyframes mo-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
@keyframes mo-morph{0%,100%{border-radius:50% 48% 52% 50%/49% 52% 48% 51%}33%{border-radius:47% 53% 49% 51%/53% 47% 52% 48%}66%{border-radius:53% 48% 51% 47%/47% 51% 49% 53%}}
.k1,.k2,.k3{animation-name:mo-flex}
@keyframes mo-flex{0%,100%{border-radius:50% 46% 54% 50%/47% 53% 47% 53%;scale:1 1}25%{border-radius:44% 56% 48% 52%/55% 45% 54% 46%;scale:1.03 .97}50%{border-radius:55% 45% 52% 48%/45% 55% 48% 52%;scale:.98 1.02}75%{border-radius:47% 53% 57% 43%/52% 48% 44% 56%;scale:1.02 .985}}
.mo-b{position:absolute;inset:0;animation-name:mo-bloom;animation-duration:1.2s;animation-timing-function:cubic-bezier(.16,.8,.24,1);animation-fill-mode:both;animation-delay:calc(var(--d,0s) - var(--t,0s));animation-play-state:var(--ps,running)}
.mo-k{position:absolute;inset:0;animation-name:mo-ink;animation-duration:1.1s;animation-timing-function:cubic-bezier(.2,.7,.2,1);animation-fill-mode:both;animation-delay:calc(var(--d,0s) - var(--t,0s));animation-play-state:var(--ps,running)}
.mo-name{display:block;animation-name:mo-rise;animation-duration:.9s;animation-timing-function:cubic-bezier(.2,.7,.2,1);animation-fill-mode:both;animation-delay:calc(var(--d,0s) - var(--t,0s));animation-play-state:var(--ps,running)}
.b1{--d:.5s}.b2{--d:.58s}.b3{--d:.66s}.b4{--d:.74s}.b5{--d:.82s}.kh{--d:0s}.kk1{--d:.03s}.kk2{--d:.1s}.kk3{--d:.17s}
@keyframes mo-ink{0%{opacity:0;transform:scale(.2);filter:blur(8px)}40%{opacity:1}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes mo-bloom{0%{opacity:0;transform:scale(.8) rotate(-120deg)}100%{opacity:1;transform:none}}
@keyframes mo-rise{0%{opacity:0;transform:translateY(8px);filter:blur(3px)}100%{opacity:1;transform:none;filter:blur(0)}}
body{margin:0}
a{text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.glass{position:relative;border:0;color:var(--glass-fg);background:var(--glass-bg);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);box-shadow:inset 0 1px 0.5px var(--glass-hi),inset 0 -1px 0.5px var(--glass-lo),inset 0 0 0 0.5px var(--glass-ring),0 10px 30px var(--glass-shadow);transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.glass::before{content:"";position:absolute;left:0;top:0;right:0;bottom:0;border-radius:inherit;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,0.28) 0%,rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,0.1) 100%)}
.glass > *{position:relative}

</style>
</helmet>
<div class="{{themeClass}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: var(--bg-grad); color: var(--fg); font-family: 'Instrument Sans', -apple-system, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 0 32px 48px">

<div class="mo" aria-hidden="true" style="--s: 220px"><div class="mo-in"><div class="mo-orb o1"><div class="mo-b b1"><div class="mo-c c1"></div></div></div><div class="mo-orb o2"><div class="mo-b b2"><div class="mo-c c2"></div></div></div><div class="mo-orb o3"><div class="mo-b b3"><div class="mo-c c3"></div></div></div><div class="mo-orb o4"><div class="mo-b b4"><div class="mo-c c4"></div></div></div><div class="mo-orb o5"><div class="mo-b b5"><div class="mo-c c5"></div></div></div><div class="mo-orb oh"><div class="mo-k kh"><div class="mo-c ch"></div></div></div><div class="mo-orb ok1"><div class="mo-k kk1"><div class="mo-c k1"></div></div></div><div class="mo-orb ok2"><div class="mo-k kk2"><div class="mo-c k2"></div></div></div><div class="mo-orb ok3"><div class="mo-k kk3"><div class="mo-c k3"></div></div></div></div></div>

<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-variation-settings: 'SOFT' 100, 'WONK' 0; font-size: 38px; line-height: 44px; font-weight: 400; letter-spacing: -0.02em">reverie</h1>
<span style="font-size: 15px; line-height: 20px; color: var(--muted)">a home for your inner world</span>
</div>
</sc-if>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<button type="button" class="glass" onClick="{{ replay }}" style="height: 48px; padding: 0 20px; border-radius: 24px; display: flex; align-items: center; gap: 8px; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 500">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
<span>Replay</span>
</button>
<a id="openReverie" class="glass" href="Home.html" onClick="{{ openApp }}" style="height: 48px; padding: 0 22px; border-radius: 24px; display: flex; align-items: center; font-size: 15px; font-weight: 500">Open reverie</a>
</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
// soft interface sounds, synthesised with the Web Audio API (no audio files)
const SFX = (() => {
  let ctx = null;
  const enabled = () => { try { return window.localStorage.getItem('voiceJournalSound') !== 'off'; } catch (e) { return true; } };
  const audio = () => {
    try {
      if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch (e) { return null; }
  };
  const tone = (c, f, t0, d, o) => {
    o = o || {};
    const t = c.currentTime + t0;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + d);
    const peak = o.g || 0.05;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    osc.connect(g);
    g.connect(o.out || c.destination);
    osc.start(t);
    osc.stop(t + d + 0.05);
  };
  const chime = (c, notes, t0, step, d, gain) => notes.forEach((f, i) => {
    tone(c, f, t0 + i * step, d, { type: 'triangle', g: gain });
    tone(c, f * 2, t0 + i * step, d * 0.6, { g: gain * 0.35 });
  });
  const play = (name) => {
    if (!enabled()) return;
    const c = audio();
    if (!c) return;
    switch (name) {
      case 'tap': tone(c, 660, 0, 0.07, { g: 0.035 }); tone(c, 990, 0, 0.05, { g: 0.015 }); break;
      case 'select': tone(c, 740, 0, 0.08, { g: 0.035 }); tone(c, 1110, 0.03, 0.08, { g: 0.015 }); break;
      case 'close': tone(c, 520, 0, 0.1, { to: 380, g: 0.035 }); break;
      case 'open': tone(c, 330, 0, 0.12, { g: 0.035 }); tone(c, 495, 0.05, 0.14, { g: 0.02 }); break;
      case 'on': tone(c, 587, 0, 0.09, { g: 0.04 }); tone(c, 880, 0.06, 0.13, { g: 0.04 }); break;
      case 'off': tone(c, 587, 0, 0.09, { g: 0.035 }); tone(c, 392, 0.06, 0.13, { g: 0.035 }); break;
      case 'start': chime(c, [523, 784], 0, 0.09, 0.32, 0.045); break;
      case 'reflect': tone(c, 440, 0, 0.4, { to: 660, g: 0.045, type: 'triangle' }); tone(c, 880, 0.12, 0.3, { g: 0.015 }); break;
      case 'reply': chime(c, [784, 988], 0, 0.11, 0.4, 0.035); break;
      case 'done': tone(c, 392, 0, 0.26, { type: 'triangle', g: 0.05 }); tone(c, 294, 0.1, 0.36, { type: 'triangle', g: 0.04 }); break;
      case 'save': chime(c, [523, 659, 784, 1047], 0, 0.08, 0.5, 0.04); break;
      case 'saved': chime(c, [659, 784, 988, 1319], 0.85, 0.09, 0.6, 0.04); break;
      case 'discard': tone(c, 330, 0, 0.14, { to: 247, g: 0.04, type: 'triangle' }); tone(c, 247, 0.09, 0.24, { to: 175, g: 0.03, type: 'triangle' }); break;
      case 'enter': {
        // short, airy, positive whoosh: a breathy rising sweep with a soft glide and a gentle major landing (no pings)
        const bus = c.createGain();
        bus.gain.value = 1;
        bus.connect(c.destination);
        const echo = c.createDelay(1);
        echo.delayTime.value = 0.16;
        const fb = c.createGain();
        fb.gain.value = 0.28;
        const damp = c.createBiquadFilter();
        damp.type = 'lowpass';
        damp.frequency.value = 3200;
        const wet = c.createGain();
        wet.gain.value = 0.45;
        bus.connect(echo);
        echo.connect(damp);
        damp.connect(fb);
        fb.connect(echo);
        damp.connect(wet);
        wet.connect(c.destination);
        // breathy air sweep
        const len = Math.floor(c.sampleRate * 1.2);
        const buf = c.createBuffer(1, len, c.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
        const noise = c.createBufferSource();
        noise.buffer = buf;
        const bp = c.createBiquadFilter();
        bp.type = 'bandpass';
        bp.Q.value = 0.7;
        bp.frequency.setValueAtTime(500, c.currentTime);
        bp.frequency.exponentialRampToValueAtTime(8000, c.currentTime + 0.65);
        const ng = c.createGain();
        ng.gain.setValueAtTime(0.0001, c.currentTime);
        ng.gain.exponentialRampToValueAtTime(0.07, c.currentTime + 0.3);
        ng.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 1.0);
        noise.connect(bp);
        bp.connect(ng);
        ng.connect(bus);
        noise.start();
        noise.stop(c.currentTime + 1.2);
        // bright rising glide in a major third for the positive lift
        tone(c, 392, 0, 0.65, { to: 784, g: 0.032, out: bus });
        tone(c, 494, 0.04, 0.65, { to: 988, g: 0.02, out: bus });
        // a warm, open major chord to land on (soft, no ping)
        tone(c, 784, 0.45, 0.65, { g: 0.022, out: bus });
        tone(c, 988, 0.47, 0.6, { g: 0.016, out: bus });
        tone(c, 1175, 0.5, 0.55, { g: 0.012, out: bus });
        break;
      }
      default: break;
    }
  };
  return { play, enabled };
})();

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: true };
  }

  componentWillUnmount() {
    clearTimeout(this._t);
  }

  themeName() {
    try { return window.localStorage.getItem('voiceJournalTheme') === 'light' ? 'light' : 'dark'; } catch (e) { return 'dark'; }
  }

  renderVals() {
    return {
      themeClass: this.themeName() === 'light' ? 'theme-light' : 'theme-dark',
      on: this.state.on,
      openApp: (e) => {
        // let the whoosh start before the screen changes
        if (this._go) return;
        this._go = true;
        if (e && e.preventDefault) e.preventDefault();
        SFX.play('enter');
        setTimeout(() => {
          const a = document.getElementById('openReverie');
          if (a) a.click();
          this._go = false;
        }, 700);
      },
      replay: () => {
        clearTimeout(this._t);
        this.setState({ on: false });
        this._t = setTimeout(() => this.setState({ on: true }), 60);
      }
    };
  }
}
</script>
