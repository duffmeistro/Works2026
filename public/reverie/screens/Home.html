<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
// soft interface sounds, synthesised with the Web Audio API (no audio files)
const SFX = (() => {
  let ctx = null;
  const enabled = () => { try { return window.localStorage.getItem('voiceJournalSound') !== 'off'; } catch (e) { return true; } };
  const audio = () => {
    try {
      if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch (e) { return null; }
  };
  const tone = (c, f, t0, d, o) => {
    o = o || {};
    const t = c.currentTime + t0;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + d);
    const peak = o.g || 0.05;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    osc.connect(g);
    g.connect(c.destination);
    osc.start(t);
    osc.stop(t + d + 0.05);
  };
  const chime = (c, notes, t0, step, d, gain) => notes.forEach((f, i) => {
    tone(c, f, t0 + i * step, d, { type: 'triangle', g: gain });
    tone(c, f * 2, t0 + i * step, d * 0.6, { g: gain * 0.35 });
  });
  const play = (name) => {
    if (!enabled()) return;
    const c = audio();
    if (!c) return;
    switch (name) {
      case 'tap': tone(c, 660, 0, 0.07, { g: 0.035 }); tone(c, 990, 0, 0.05, { g: 0.015 }); break;
      case 'select': tone(c, 740, 0, 0.08, { g: 0.035 }); tone(c, 1110, 0.03, 0.08, { g: 0.015 }); break;
      case 'close': tone(c, 520, 0, 0.1, { to: 380, g: 0.035 }); break;
      case 'open': tone(c, 330, 0, 0.12, { g: 0.035 }); tone(c, 495, 0.05, 0.14, { g: 0.02 }); break;
      case 'on': tone(c, 587, 0, 0.09, { g: 0.04 }); tone(c, 880, 0.06, 0.13, { g: 0.04 }); break;
      case 'off': tone(c, 587, 0, 0.09, { g: 0.035 }); tone(c, 392, 0.06, 0.13, { g: 0.035 }); break;
      case 'start': chime(c, [523, 784], 0, 0.09, 0.32, 0.045); break;
      case 'reflect': tone(c, 440, 0, 0.4, { to: 660, g: 0.045, type: 'triangle' }); tone(c, 880, 0.12, 0.3, { g: 0.015 }); break;
      case 'reply': chime(c, [784, 988], 0, 0.11, 0.4, 0.035); break;
      case 'done': tone(c, 392, 0, 0.26, { type: 'triangle', g: 0.05 }); tone(c, 294, 0.1, 0.36, { type: 'triangle', g: 0.04 }); break;
      case 'save': chime(c, [523, 659, 784, 1047], 0, 0.08, 0.5, 0.04); break;
      case 'saved': chime(c, [659, 784, 988, 1319], 0.85, 0.09, 0.6, 0.04); break;
      case 'discard': tone(c, 330, 0, 0.14, { to: 247, g: 0.04, type: 'triangle' }); tone(c, 247, 0.09, 0.24, { to: 175, g: 0.03, type: 'triangle' }); break;
      default: break;
    }
  };
  return { play, enabled };
})();

class Component extends DCLogic {
componentDidMount() {
if (this.savedFlag()) SFX.play('saved');
if (this.savedFlag()) this._savedT = setTimeout(() => this.setState({ savedDone: true }), 2600);
this._onStore = (ev) => {
if (ev && ev.key === 'reverieSaved' && ev.newValue) {
clearTimeout(this._savedT);
this._sv = true;
try { window.localStorage.removeItem('reverieSaved'); } catch (e) { /* no storage */ }
SFX.play('saved');
this.setState({ savedDone: false });
this._savedT = setTimeout(() => this.setState({ savedDone: true }), 2600);
return;
}
this.forceUpdate();
};
window.addEventListener('storage', this._onStore);
}

componentWillUnmount() {
clearTimeout(this._savedT);
window.removeEventListener('storage', this._onStore);
}

savedFlag() {
if (this._sv === undefined) {
this._sv = false;
try {
const t = Number(window.localStorage.getItem('reverieSaved') || 0);
if (t && Date.now() - t < 8000) this._sv = true;
window.localStorage.removeItem('reverieSaved');
} catch (e) { /* no storage */ }
}
return this._sv;
}

renderVals() {
const B = '#1450FF', R = '#FF2A12', Y = '#FFD400', O = '#FF7A00', C = '#00C8FF';
const PAL = [[B, R, Y], [R, O, B], [Y, C, R], [B, Y, O], [O, Y, B], [C, B, Y]];
const ring = (e, size, t) => {
const p = PAL[e.ci % PAL.length];
return '--s:' + size + 'px;--ca:' + p[0] + ';--cb:' + p[1] + ';--cc:' + p[2] + ';--t:' + t + 's';
};
const openId = (this.state && this.state.openId) || null;
const all = this.entries();
const months = [];
all.forEach((e, i) => {
let m = months[months.length - 1];
if (!m || m.name !== e.month) {
m = { name: e.month, year: e.year, cards: [], insights: () => { try { window.localStorage.setItem('reverieInsightsMonth', e.year + '-' + String(['January','February','March','April','May','June','July','August','September','October','November','December'].indexOf(e.month) + 1).padStart(2, '0')); } catch (err) { /* no storage */ } } };
months.push(m);
}
m.cards.push({
day: e.day,
wd: e.wd,
preview: e.paras[0],
ringStyle: ring(e, Math.round(84 + 44 * e.lvl), (i * 2.7).toFixed(1)),
open: () => { this.setState({ openId: e.id, prog: 0 }); }
});
});
const cur = all.find((e) => e.id === openId);
const detail = cur ? {
longDate: cur.longDate,
q: cur.q,
paras: cur.paras.map((t) => ({ text: t })),
hasReply: !!cur.reply,
reply: cur.reply || '',
ringStyle: ring(cur, 580, 1.3),
ringOpacity: (0.1 + 0.9 * ((this.state && this.state.prog) || 0)).toFixed(3),
ringShift: (() => { const p = (this.state && this.state.prog) || 0; const x = Math.max(0, Math.min(1, (p - 0.1) / 0.9)); return (x * x * (3 - 2 * x) * 160).toFixed(0) + 'px'; })()
} : { longDate: '', q: '', paras: [], hasReply: false, reply: '', ringStyle: '--s:0px', ringShift: '0px', ringOpacity: '0.1' };
return {
ctaClass: (this.savedFlag() && !(this.state && this.state.savedDone)) ? 'is-saved' : '',
themeClass: this.themeName() === 'light' ? 'theme-light' : 'theme-dark',
months,
showDetail: !!cur,
detail,
onBack: () => { this.setState({ openId: null, prog: 0 }); },
onNew: () => SFX.play('tap'),
onDetailScroll: (ev) => {
const el = ev && ev.target;
if (!el) return;
const max = el.scrollHeight - el.clientHeight;
const prog = max > 8 ? Math.max(0, Math.min(1, el.scrollTop / max)) : 0;
if (Math.abs(prog - ((this.state && this.state.prog) || 0)) > 0.01) this.setState({ prog });
}
};
}
